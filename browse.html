<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone | Browse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">♫ Spotify</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="playlist.html">My Playlist</a>
        </nav>

        <div class="nav-actions">
            <a href="#premium">Premium</a>
            <a href="#support">Support</a>
            <a href="#download">Download</a>
        </div>
    </header>

    <main>
        <section class="browse-heading">
            <h1 id="page-title">Browse all</h1>
            <p>Find music for every mood and moment.</p>

            <form action="browse.html" method="get">
                <input type="text" name="search"
                    placeholder="Search songs or genres..."
                    required>
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="section">
            <h2>Explore genres</h2>

            <div class="genres">
                <a href="playlist.html" class="genre-card pop">
                    <h3>Pop</h3>
                    <img src="https://placehold.co/120x120/E76F51/FFFFFF?text=Pop"
                        alt="Pop music cover">
                </a>

                <a href="playlist.html" class="genre-card hiphop">
                    <h3>Hip-Hop</h3>
                    <img src="https://placehold.co/120x120/6D597A/FFFFFF?text=Hip-Hop"
                        alt="Hip-Hop music cover">
                </a>

                <a href="playlist.html" class="genre-card rock">
                    <h3>Rock</h3>
                    <img src="https://placehold.co/120x120/264653/FFFFFF?text=Rock"
                        alt="Rock music cover">
                </a>

                <a href="playlist.html" class="genre-card chill">
                    <h3>Chill</h3>
                    <img src="https://placehold.co/120x120/457B9D/FFFFFF?text=Chill"
                        alt="Chill music cover">
                </a>

                <a href="playlist.html" class="genre-card workout">
                    <h3>Workout</h3>
                    <img src="https://placehold.co/120x120/BC4749/FFFFFF?text=Workout"
                        alt="Workout music cover">
                </a>

                <a href="playlist.html" class="genre-card jazz">
                    <h3>Jazz</h3>
                    <img src="https://placehold.co/120x120/386641/FFFFFF?text=Jazz"
                        alt="Jazz music cover">
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>Spotify Clone | DevCamp 2.0</p>
        <a href="#support">Support</a>
        <a href="#download">Download</a>
    </footer>

</body>
</html>
